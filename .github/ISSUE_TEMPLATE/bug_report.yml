name: Reporte de error
description: Reporta un problema observable en C / escuela.
title: "[Error]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "No incluyas información privada ni código de terceros."
  - type: input
    id: route
    attributes:
      label: Ruta de aprendizaje
      placeholder: C, Python, JavaScript...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que ocurriera
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué ocurrió
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y dispositivo
      placeholder: Safari en macOS, Chrome en Android...
